      for (let k = 0; d3.sum(cnt) < tt; k = (k + 1) % NR) cnt[NR - 1 - k]++;
      const seats = []; rr.forEach((r, i) => d3.range(cnt[i]).forEach(j => { const th = Math.PI * (1 - (j + 0.5) / cnt[i]); seats.push({ r, th, x: r * Math.cos(th), y: -r * Math.sin(th) }); }));
      seats.sort((a, b) => d3.descending(a.th, b.th) || a.r - b.r);
      let si = 0; const paths = rows.map(rw => { const sl = seats.slice(si, si + rw.tot); si += rw.tot; return sl.map(s => `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="2.9" fill="${colorOf(rw.p)}"><title>${pn(rw.p, y)} ${rw.tot}</title></circle>`).join(''); }).join('');
      return `<div><h4>ปี 25${y}</h4><svg viewBox="-138 -138 276 150">${paths}<text y="-8" text-anchor="middle" font-size="26" font-weight="600" fill="#2D3748">${tt}</text><text y="8" text-anchor="middle" font-size="11" fill="#64748b">ที่นั่งทั้งหมด</text></svg>
        <div class="sbar-leg" style="justify-content:center">${rows.slice(0, 5).map(r => `<span style="--c:${colorOf(r.p)}">${pn(r.p, y)} ${r.tot}</span>`).join('')}</div></div>`;
    };

  // ข้อ 11: สลับพื้นที่เป้าหมาย / พื้นที่เสี่ยง (เหมือน index) + กรองผู้ไม่มาใช้สิทธิ
  const gSt = { view: 'attack', hide: true, high: false };
  const RED_LOW = '#FED7D7', RED_HIGH = '#C53030';
  function gMap() {
    const { view, hide, high } = gSt, atk = view === 'attack';
    const gScale = d3.scaleLinear([0, 1], ['#FFFFFF', ORANGE]).interpolate(d3.interpolateRgb);
    const redScale = d3.interpolateRgb(RED_LOW, RED_HIGH), cl = v => Math.max(0, Math.min(1, v));
    const rel = z => z.margin < 5 && (!high || z.nv >= NV_AVG) && (atk ? z.prank !== 1 : z.prank === 1);
    const inScope = z => z.margin < 5 && (!high || z.nv >= NV_AVG);
    const show = z => hide ? rel(z) : inScope(z);
    const color = z => atk
      ? (z.prank === 1 ? ORANGE : gScale(cl(1 - (z.xs == null ? 12 : z.xs) / 12)))
      : (z.prank === 1 ? redScale(Math.pow(cl(1 + z.xs / 12), 1.2)) : '#E5E7EB');
    mapS.paint({ fill: z => z.w69, show, faded: .12, mark: z => atk && z.prank === 1, color });
    const sub = high ? ` · ผู้ไม่มาใช้สิทธิ ≥ ${NV_AVG.toFixed(1)}%` : '';
    d3.select('#legend').html(atk
      ? `<div class="cap">พื้นที่เป้าหมาย (เขตสูสีที่ยังไม่ชนะ)${sub}</div><span style="--c:${ORANGE}">ชนะแล้ว ◥</span>

      : `<div class="cap">พื้นที่เสี่ยง (เขตสูสีที่ชนะอยู่)${sub}</div>
         <span style="display:inline-flex;align-items:center;gap:6px">ความเสี่ยงต่ำ <span style="display:inline-block;width:90px;height:10px;border-radius:3px;border:1px solid #CBD5E0;background:linear-gradient(90deg,${RED_LOW},${RED_HIGH})"></span> สูง (กันชน 0 จุด)</span>`);
    d3.select('#ctl').html(`<div style="width:100%;display:flex;gap:6px;justify-content:center">
        <button class="${atk ? 'on' : ''}" data-v="attack">พื้นที่เป้าหมาย (${close.filter(z => z.prank !== 1).length})</button><button class="${atk ? '' : 'on'}" data-v="defend">พื้นที่เสี่ยง (${r1.length})</button></div>
      <label style="font-size:12px;color:#475569;cursor:pointer"><input type="checkbox" id="gHide" ${hide ? 'checked' : ''}> ซ่อนเขตที่ไม่เกี่ยวข้อง (${atk ? 'เขตที่ชนะ' : 'เขตที่แพ้'})</label>
      <button class="${high ? 'on' : ''}" data-h="1">ผู้ไม่มาใช้สิทธิสูง (${close.filter(z => z.nv >= NV_AVG).length})</button>`);
    d3.selectAll('#ctl button[data-v]').on('click', function () { gSt.view = this.dataset.v; gMap(); });
    d3.select('#gHide').on('change', function () { gSt.hide = this.checked; gMap(); });
    d3.select('#ctl button[data-h]').on('click', () => { gSt.high = !gSt.high; gMap(); });
  }

  // ---------- หน้าปกและหน้าสรุป ----------
  const cover = { cover: true, head: 'บทวิเคราะห์การเลือกตั้ง 2569', no: 'แผนที่เล่าเรื่อง', title: 'เจาะลึกการเลือกตั้ง 69 และกลยุทธ์กวาดคะแนนในการเลือกตั้งครั้งถัดไป', mode: 'map',
    html: `<p>ใครชนะ ชนะที่ไหน เพราะอะไร และถ้าเป็นพรรคส้มจะสู้ที่ไหน — กด "ถัดไป" เพื่อดูภาพเปลี่ยนไปทีละตอน แล้วค่อยไปสำรวจเขตของคุณเองในเครื่องมือเต็ม</p><p style="font-size:13px;opacity:.8">${S.length} ตอน</p><button class="btn" id="startbtn">เริ่มเลย →</button>`,

  const deckSlides = [cover, ...S, finale], T = deckSlides.length;

  const wrap = d3.select('#cardwrap'), dotsEl = d3.select('#dots');
  dotsEl.selectAll('button').data(deckSlides).enter().append('button').attr('class', 'dot').attr('aria-label', (d, i) => `ไปหน้า ${i + 1}`).on('click', (e, d) => go(deckSlides.indexOf(d)));
  let cur = -1, swapT = null;
  function show(i) {
    const sc = deckSlides[i];
    wrap.html(`<div class="topic">${sc.head || ''}</div><div class="card${sc.cover ? ' cover' : ''}"><div class="no">${sc.no}</div><h2>${sc.title}</h2>${sc.html}</div>`);

  }
  function setMode(m) {
    d3.select('#mapS').classed('show', m === 'map'); d3.select('#mapD').classed('show', m === 'dual'); d3.select('#panel').classed('show', m === 'panel');
  }
  function go(i, fromHash) {
    i = Math.max(0, Math.min(T - 1, i)); if (i === cur) return;
    const first = cur < 0; cur = i; const sc = deckSlides[i];
    clearTimeout(swapT);
    if (first) show(i); else { wrap.classed('out', true); swapT = setTimeout(() => show(i), 220); }
    dotsEl.selectAll('.dot').classed('on', (_, k) => k === i);
    d3.select('#prev').property('disabled', i === 0);
    d3.select('#next').property('disabled', i === T - 1).style('visibility', i === T - 1 ? 'hidden' : 'visible');
    d3.select('#prog').style('width', (i / (T - 1) * 100) + '%');
    d3.select('#exploreBtn').classed('hide', i === T - 1);
    d3.select('#ctl').html('');
    if (sc.dm) { d3.select('#dmLt').text(sc.dm[0]); d3.select('#dmRt').text(sc.dm[1]); }
    setMode(sc.mode || 'map'); sc.run();
    if (!fromHash) { try { history.replaceState(null, '', i === 0 ? location.pathname : '#' + i); } catch (e) {} }
  }
  d3.select('#next').on('click', () => go(cur + 1)); d3.select('#prev').on('click', () => go(cur - 1));
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('a,input,select,textarea,button.dot')) return;
    if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !(e.target.closest && e.target.closest('button')))) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0); else if (e.key === 'End') go(T - 1);
  });
  let tx = null, ty = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1)); }, { passive: true });
  const fromHash = () => { const n = parseInt((location.hash || '').slice(1)); return isNaN(n) ? 0 : n; };
  addEventListener('hashchange', () => go(fromHash(), true));
