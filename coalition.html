<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จับขั้วรัฐบาล</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>

/* Layout: two white panels (รัฐบาล | ฝ่ายค้าน) under slate title bars, facing each other across a VS medallion; unassigned parties wrap in a tray below.
   Look follows the reference map: warm paper ground, slate bars, teal accent, flat saturated party colours, heavy rounded Thai type. */
:root {
  --bg: #f6f3ee;
  --panel: #ffffff;
  --slate: #2f3a4f;
  --teal: #4f9a94;
  --line: #d9d3c7;
  --fg: #2b2f3a;
  --muted: #6f7482;
  --slot: #efebe3;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 38px); margin: 0; text-wrap: balance; color: var(--slate); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.tools { display: flex; gap: 8px; }
button.tool {
  font: 600 14px var(--font-body); color: var(--slate); background: #fff;
  border: 1.5px solid var(--slate); border-radius: 10px; padding: 9px 16px; cursor: pointer;
}
button.tool.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
button.tool:hover { filter: brightness(.95); }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: start; }
.vs { margin-top: 150px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--font-display); color: #fff; background: var(--slate); box-shadow: 0 0 0 4px var(--bg), 0 0 0 5.5px var(--slate); }

.side { min-width: 0; background: var(--panel); border-radius: 16px; box-shadow: 0 2px 14px rgba(47,58,79,.10); overflow: hidden; display: grid; align-content: start; }
.score { display: grid; gap: 8px; padding: 12px 16px 14px; background: var(--slate); color: #fff; }
.score-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.score-name { font: 700 18px var(--font-display); }
.score-num { font: 700 32px var(--font-display); font-variant-numeric: tabular-nums; line-height: 1; }
.score-num small { font: 500 14px var(--font-body); opacity: .75; margin-left: 4px; }
.meter { position: relative; height: 8px; border-radius: 99px; background: rgba(255,255,255,.18); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; transition: width .35s ease; background: #7fc9c1; }
.meter b { position: absolute; left: 50.2%; top: -4px; bottom: -4px; width: 2px; background: #fff; }
.meter-note { display: flex; justify-content: space-between; font-size: 12px; opacity: .85; min-height: 18px; }
.win { color: #9be3da; font-weight: 600; opacity: 1; }

.zone { padding: 14px; border: 2px dashed transparent; border-radius: 12px; margin: 4px; transition: background .15s, border-color .15s; }
.zone.over { background: #e6f2f0; border-color: var(--teal); }
.thrones { display: grid; grid-template-columns: 1fr 1.18fr 1fr; gap: 8px; align-items: center; }
.slot-big { aspect-ratio: 3 / 4.4; min-width: 0; }
.slot-big.c { aspect-ratio: 3 / 5.2; }
.minis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.slot-mini { aspect-ratio: 1; min-width: 0; }

.throne { width: 100%; height: 100%; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--slot); display: grid; place-items: center; }
.throne svg { width: 50%; height: auto; stroke: #b9b2a3; fill: none; stroke-width: 1.8; }
.slot-mini .throne svg { width: 58%; }

.card {
  --c: #888; position: relative; width: 100%; height: 100%; min-width: 0;
  border-radius: 10px; overflow: hidden; cursor: grab; touch-action: none;
  display: flex; flex-direction: column; justify-content: flex-end;
  background: var(--c); color: #fff; text-align: center;
  box-shadow: 0 2px 6px rgba(47,58,79,.25);
}
.card:active { cursor: grabbing; }
.card.dragging { opacity: .25; }
.emb { display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--c); font-family: var(--font-display); font-weight: 700; }
.card .emb { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 84%; aspect-ratio: 1; font-size: clamp(40px, 7vw, 76px); }
.card .nm { position: absolute; top: 8px; left: 6px; right: 6px; font: 600 clamp(11px, 1.6vw, 14px)/1.2 var(--font-display); overflow-wrap: anywhere; }
.card .seat { background: rgba(0,0,0,.22); padding: 6px 4px 7px; font: 700 clamp(20px, 3.4vw, 30px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.card .seat small { font: 500 11px var(--font-body); margin-left: 3px; opacity: .85; }

.card .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; pointer-events: none; }
.emb img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: 50% 12%; pointer-events: none; }
.card.has-img .emb { top: 8px; left: 8px; transform: none; width: 38px; height: 38px; font-size: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.card.has-img .nm { top: auto; bottom: 0; left: 0; right: 0; padding: 22px 6px 6px; background: linear-gradient(transparent, rgba(0,0,0,.65)); position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.card.has-img .seat { position: relative; }
.tray .card.has-img .emb { top: 6px; width: 24px; font-size: 13px; }

.emb.logo { border: 2px solid #fff; background: #fff; }
.emb.logo img { object-position: 50% 50%; }
.card.mini { justify-content: center; align-items: center; gap: 1px; padding: 2px; }
.card.mini .emb { position: static; transform: none; width: 72%; font-size: clamp(18px, 3vw, 28px); }
.card.mini .seat { background: none; padding: 0; font-size: clamp(11px, 1.9vw, 15px); }
.card.mini .seat small, .card.mini .nm { display: none; }

.trayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.tray-title { font: 700 16px var(--font-display); color: var(--slate); }
.tray-hint { color: var(--muted); font-size: 13px; }
.tray { background: var(--panel); border-radius: 16px; box-shadow: 0 2px 14px rgba(47,58,79,.10); border: 2px dashed transparent; padding: 14px; min-height: 120px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; transition: background .15s, border-color .15s; }
.tray .cell { aspect-ratio: 3 / 4; min-width: 0; }
.tray .card .nm { top: 6px; font-size: 11px; }
.tray .card .emb { top: 47%; width: 66%; font-size: 34px; }
.tray .card .seat { font-size: 18px; }
.empty { grid-column: 1 / -1; align-self: center; text-align: center; color: var(--muted); font-size: 14px; }
.tray.over { border-color: var(--teal); background: #e6f2f0; }

.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 14px 30px rgba(47,58,79,.4); border-radius: 10px; }
.ghost .card { cursor: grabbing; }
.foot { color: var(--muted); font-size: 12px; }

@media (max-width: 760px) {
  .stage { grid-template-columns: 1fr; }
  .vs { margin: 0; justify-self: center; width: 42px; height: 42px; font-size: 13px; }
  .zone { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { .meter i, .zone, .tray { transition: none; } }

.tool.back { display: inline-flex; align-items: center; text-decoration: none; font: 600 14px var(--font-body); color: var(--slate); background: #fff; border: 1.5px solid var(--slate); border-radius: 10px; padding: 9px 16px; }
.tool.back:hover { filter: brightness(.95); }

[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>จับขั้วรัฐบาล</h1>
      <p class="sub">ผลเลือกตั้ง 69 · สส. 500 ที่นั่ง · ต้องมี 251 เสียงขึ้นไปจึงเป็นเสียงข้างมาก</p>
    </div>
    <div class="tools">
      <a class="tool back" href="index.html" aria-label="กลับไปแผนที่">← กลับ</a>
      <button class="tool primary" id="flip" type="button">⇄ พลิกขั้ว</button>
      <button class="tool" id="reset" type="button">↺ เริ่มใหม่</button>
    </div>
  </header>

  <section class="stage" aria-label="จับขั้วรัฐบาล">
    <div class="side gov" id="gov"></div>
    <div class="vs">VS</div>
    <div class="side opp" id="opp"></div>
  </section>

  <section>
    <div class="trayhead">
      <span class="tray-title">ยังไม่มีฝ่าย <span id="poolCount"></span></span>
      <span class="tray-hint">ลากการ์ดพรรคไปวางฝั่งที่ต้องการ หรือโฟกัสแล้วกด G (รัฐบาล) / O (ฝ่ายค้าน) / P (ยังไม่มีฝ่าย)</span>
    </div>
    <div class="tray" id="pool" data-zone="pool"></div>
  </section>
  <p class="foot">จำนวน สส. จากคอลัมน์ Grand Total (แบ่งเขต + บัญชีรายชื่อ) ของไฟล์ Count_69-Real.csv</p>
</div>

parties.forEach(p => { if (LOGOS[p.name]) p.logo = LOGOS[p.name]; });
const TOTAL = parties.reduce((s, p) => s + p.seats, 0);
const MAJ = Math.floor(TOTAL / 2) + 1;
const byName = Object.fromEntries(parties.map(p => [p.name, p]));
let side = {};
const sortFn = (a, b) => b.seats - a.seats || a.order - b.order;

function reset() { parties.forEach(p => side[p.name] = "pool"); }
reset();

const CHAIR = '<svg viewBox="0 0 60 84" aria-hidden="true"><path d="M14 34 V18 Q14 6 30 4 Q46 6 46 18 V34"/><path d="M10 34 H50 V46 H10 Z"/><path d="M14 46 V76 M46 46 V76 M10 76 H18 M42 76 H50"/><path d="M30 12 V28"/></svg>';
const throne = () => `<div class="throne">${CHAIR}</div>`;
const lead = n => { const m = [...n].find(c => !"เแโไใ".includes(c)); return m || n[0]; };

function cardHTML(p, mini) {
  const face = p.logo || (p.img && mini ? p.img : null);
  const e = `<span class="emb ${p.logo ? "logo" : ""}">${face ? `<img src="${face}" alt="" draggable="false">` : lead(p.name)}</span>`;
  const cls = `card ${mini ? "mini" : ""} ${p.img && !mini ? "has-img" : ""}`;
  const photo = p.img && !mini ? `<img class="photo" src="${p.img}" alt="" draggable="false">` : "";
  return `<div class="${cls}" tabindex="0" role="button" data-name="${p.name}" style="--c:${p.color}" title="${p.name} ${p.seats} ที่นั่ง" aria-label="${p.name} ${p.seats} ที่นั่ง">` +
    (mini ? `${e}<span class="seat">${p.seats}</span>` : `${photo}<span class="nm">${p.name}</span>${e}<span class="seat">${p.seats}<small>ที่นั่ง</small></span>`) + `</div>`;
}

function sideHTML(key, label) {
  const list = parties.filter(p => side[p.name] === key).sort(sortFn);
  const sum = list.reduce((s, p) => s + p.seats, 0);
  const big = [list[1], list[0], list[2]]; // centre = largest
  const rest = list.slice(3);
  const nMini = Math.max(6, Math.ceil(rest.length / 6) * 6);
  let thr = "", minis = "";
  big.forEach((p, i) => { thr += `<div class="slot-big ${i === 1 ? "c" : ""}">${p ? cardHTML(p, false) : throne()}</div>`; });
  for (let i = 0; i < nMini; i++) minis += `<div class="slot-mini">${rest[i] ? cardHTML(rest[i], true) : throne()}</div>`;
  const win = sum >= MAJ;
  const note = win ? `<span class="win">เสียงข้างมาก เกิน ${sum - MAJ + 1 > 0 ? sum - MAJ : 0} ที่นั่งจากเส้น ${MAJ}</span>` : `<span>ขาดอีก ${MAJ - sum} ที่นั่งถึง ${MAJ}</span>`;
  return `<div class="score"><div class="score-top"><span class="score-name">${label}</span><span class="score-num">${sum}<small>ที่นั่ง</small></span></div>
    <div class="meter" aria-hidden="true"><i style="width:${sum / TOTAL * 100}%"></i><b></b></div>
    <div class="meter-note">${note}<span>${list.length} พรรค</span></div></div>
    <div class="zone" data-zone="${key}"><div class="thrones">${thr}</div><div class="minis">${minis}</div></div>`;
}

function render() {
  document.getElementById("gov").innerHTML = sideHTML("gov", "ฝ่ายรัฐบาล");
  document.getElementById("opp").innerHTML = sideHTML("opp", "ฝ่ายค้าน");
  const pool = parties.filter(p => side[p.name] === "pool").sort(sortFn);
  document.getElementById("pool").innerHTML = pool.length
    ? pool.map(p => `<div class="cell">${cardHTML(p, false)}</div>`).join("")
    : `<div class="empty">จัดครบทุกพรรคแล้ว ลองพลิกขั้วหรือลากพรรคกลับมาที่นี่</div>`;
  const left = pool.reduce((s, p) => s + p.seats, 0);
  document.getElementById("poolCount").textContent = `· ${pool.length} พรรค ${left} ที่นั่ง`;
}

/* drag and drop with pointer events (mouse, touch, pen) */
let drag = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest(".card");
  if (!card || e.button > 0) return;
  drag = { name: card.dataset.name, card, x: e.clientX, y: e.clientY, ghost: null, id: e.pointerId };
});
document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.ghost) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
    const r = drag.card.getBoundingClientRect();
    const g = document.createElement("div");
    g.className = "ghost";
    g.style.width = Math.max(r.width, 84) + "px";
    g.style.height = Math.max(r.height, 112) + "px";
    g.innerHTML = cardHTML(byName[drag.name], false);
    document.body.appendChild(g);
    drag.ghost = g;
    drag.card.classList.add("dragging");
  }
  drag.ghost.style.left = e.clientX + "px";
  drag.ghost.style.top = e.clientY + "px";
  document.querySelectorAll(".over").forEach(n => n.classList.remove("over"));
  const z = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-zone]");
  if (z) z.classList.add("over");
  e.preventDefault();
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  document.querySelectorAll(".over").forEach(n => n.classList.remove("over"));
  if (!d.ghost) return;
  d.ghost.remove();
  const z = cancel ? null : document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-zone]");
  if (z) side[d.name] = z.dataset.zone;
  render();
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));

/* keyboard: G / O / P move the focused card, Enter cycles */
document.addEventListener("keydown", e => {
  const card = e.target.closest?.(".card");
  if (!card) return;
  const n = card.dataset.name, k = e.key.toLowerCase();
  const map = { g: "gov", o: "opp", p: "pool" };
  if (map[k]) side[n] = map[k];
  else if (e.key === "Enter" || e.key === " ") { side[n] = { pool: "gov", gov: "opp", opp: "pool" }[side[n]]; e.preventDefault(); }
  else return;
  render();
  document.querySelector(`.card[data-name="${n}"]`)?.focus();
});

document.getElementById("flip").onclick = () => {
  parties.forEach(p => { if (side[p.name] === "gov") side[p.name] = "opp"; else if (side[p.name] === "opp") side[p.name] = "gov"; });
  render();
};
document.getElementById("reset").onclick = () => { reset(); render(); };

render();
</script>

</body>
